---
name: build_container

env:
  GITHUB_TOKEN: ${{ github.token }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'release/**'
    tags:
      - '*'

jobs:
  build_container:
    runs-on: ubuntu-22.04
    permissions:
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: configure QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: 'arm64'

      - name: configure buildx
        uses: docker/setup-buildx-action@v4

      - name: login to ghcr.io
        uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: extract tag name
        id: tag
        run: echo "WAS_UI_TAG=${{ steps.metadata.outputs.version || 'main' }}" >> $GITHUB_OUTPUT

      - name: git describe
        run: echo "WAS_VERSION=$(git describe --always --dirty --tags)" >> $GITHUB_OUTPUT
        id: gd

      - name: build container
        uses: docker/build-push-action@v7
        with:
          build-args: |
            WAS_UI_TAG=${{ steps.tag.outputs.WAS_UI_TAG }}
            WAS_VERSION=${{ steps.gd.outputs.WAS_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/riscv64
          push: ${{ github.event_name == 'push' && github.actor != 'dependabot[bot]' }}
          labels: ${{ steps.metadata.outputs.labels }}
          tags: |
            ${{ steps.metadata.outputs.tags }}
            ${{ contains(steps.metadata.outputs.version, '-rc.') && format('{0}/{1}:rc', env.REGISTRY, env.IMAGE_NAME) || '' }}
